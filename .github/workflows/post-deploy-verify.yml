name: Post Deploy Verify

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  verify-production:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for provider deployments
        run: sleep 120

      - name: Verify backend health endpoint
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "RENDER_BACKEND_URL is not set. Skipping backend verification."
            exit 0
          fi

          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$BACKEND_URL/api/health"; then
              echo "Backend health check passed."
              exit 0
            fi
            echo "Backend not ready yet. Retrying in 30 seconds..."
            sleep 30
          done

          echo "Backend health check failed after retries."
          exit 1

      - name: Verify frontend home page
        env:
          FRONTEND_URL: ${{ secrets.VERCEL_FRONTEND_URL }}
        run: |
          if [ -z "$FRONTEND_URL" ]; then
            echo "VERCEL_FRONTEND_URL is not set. Skipping frontend verification."
            exit 0
          fi

          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$FRONTEND_URL" > /dev/null; then
              echo "Frontend health check passed."
              exit 0
            fi
            echo "Frontend not ready yet. Retrying in 30 seconds..."
            sleep 30
          done

          echo "Frontend health check failed after retries."
          exit 1
